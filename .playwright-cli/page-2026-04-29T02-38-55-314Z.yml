      - generic [ref=e30]:
        - generic [ref=e31]: 状态流转说明
        - generic [ref=e32]: 状态流转的含义是：用户只要站在当前页面，下一步会去哪里的概率； 衡量的是相邻节点之间的直接导流概率。 例如，首页到搜索页的状态转移概率是 25.02%， 代表只要此刻在首页的用户，下一步去搜索页的概率是 25.02%。
