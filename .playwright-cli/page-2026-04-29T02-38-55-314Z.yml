    - generic [ref=e46]:
      - heading "二、效能评估：业务价值与干预" [level=2] [ref=e47]
      - generic [ref=e48]: "* 模型基准点：以【首页】为初始节点进行计算，已剔除首页自身的移除效应"
      - generic [ref=e49]: 备注：吸收概率与移除效应工作表仅提供10个非吸收状态（首页~结算页），本屏按原表原样展示。
      - generic [ref=e50]:
        - generic [ref=e51]:
          - generic [ref=e52]: 完整场景吸收概率（Absorption Probability）
          - generic [ref=e53]: 进入节点后最终支付成功的数学期望。
          - generic [ref=e54]: 吸收概率代表只要用户进入过这个页面，无论他之后在 App 里绕多少弯路，最终能成功下单的概率。它剥离了用户中间反复横跳的过程，直接评估各个状态的“终极变现期望值”。 举例，搜索页的吸收概率是 14.91%，代表用户只要进入过搜索页，他最终下单的概率是 14.91%； 只要进入过购物车，下单概率就是 19.35%。我们据此可以定义出犹豫区间（比如黄色的搜索、商详、购物车），重点进行精准干预。
        - generic [ref=e58]:
          - generic [ref=e59]: 完整场景移除效应（Removal Effect）
          - generic [ref=e60]: 按降幅从大到小排序，剔除“首页”节点。
          - generic [ref=e61]: 移除效应的意义是比较各个节点的价值以决定资源分配，即对首页到支付成功的吸收概率（视为大盘吸收概率）的影响； 在 Markov 算法中模拟移除某个节点后，大盘吸收概率的下降值就是该节点的移除效应。 比如会员中心的移除效应显示下降 0.90%，代表它是价值较低的场景； 而除了不可移除的购物车、结算和提交订单，搜索场景的移除效应为 8.04%，当前端最高可移除价值节点为 搜索页。