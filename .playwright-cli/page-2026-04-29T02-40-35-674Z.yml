      - paragraph [ref=e75]: 这部分直接看用户停留到某一秒后，下一步更可能去结算，还是更可能离开。提醒阈值就放在这样一个时点：去结算概率已经进入相对稳定区间，而仍留在购物车里的可干预人群还足够大。
