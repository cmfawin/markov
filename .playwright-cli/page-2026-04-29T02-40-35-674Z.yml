        - paragraph [ref=e85]: 核心思路很直接：每到一秒，先看还有多少人仍留在购物车，再看这批人里有多少人在这一秒去结算、多少人在这一秒离开。这样就能直接判断这一刻更像是自然成交窗口，还是更像是流失窗口。
